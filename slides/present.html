<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>スライド投影</title><link rel="stylesheet" href="./canvas.css?v=4"><style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif}
#output{position:relative;width:100%;height:100%}
#blackout{display:none;position:fixed;inset:0;background:#000;z-index:9999}
body.blackout #blackout{display:block}
#presenter-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(16,32,28,.86);color:#fff;font-size:12px;z-index:10000;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 6px 20px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15)}
#presenter-bar.is-visible,#presenter-bar:hover,#presenter-bar:focus-within{opacity:1;pointer-events:auto}
#presenter-bar button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:5px 11px;font:inherit;cursor:pointer}
#presenter-bar button:hover{background:rgba(255,255,255,.2)}
#presenter-page{min-width:56px;text-align:center;font-variant-numeric:tabular-nums;color:#d6e7df}
</style></head><body><main id="output"><div id="canvas" class="slide-canvas"></div></main><div id="blackout"></div><nav id="presenter-bar" aria-label="投影操作"><button type="button" id="present-prev">‹ 前へ</button><span id="presenter-page">1 / 1</span><button type="button" id="present-next">次へ ›</button><button type="button" id="present-blackout">黒画面 (B)</button><button type="button" id="present-fullscreen">全画面</button></nav><script src="./core.js?v=4"></script><script src="./present.js?v=3"></script></body></html>
