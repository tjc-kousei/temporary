<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スクリーン表示</title>
    <style>
        /* === フォント読み込み === */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&display=swap');

        /* === 共通設定 === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-weight: bold;
            /* ★元のスタイルの「太字」を再現 */
        }

        html,
        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* === モード別表示制御 === */
        #bible-view,
        #title-view,
        #hymn-view {
            display: none;
            width: 100%;
            height: 100%;
        }

        /* bodyクラスで切り替え */
        body.bible-mode {
            background-color: beige;
        }

        body.bible-mode #bible-view {
            display: flex;
            flex-direction: column;
        }

        body.title-mode {
            background-color: beige;
        }

        body.title-mode #title-view {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.hymn-mode {
            background-color: white;
        }

        body.hymn-mode #hymn-view {
            display: block;
        }


        /* =========================================
           1. 聖書モード (Bible Mode)
           ========================================= */
        /* ヘッダー */
        #b_header {
            flex: 0 0 auto;
            width: 100%;
            height: 18vh;
            background-color: #20604F;
            color: white;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            white-space: nowrap;
            overflow: hidden;
            padding: 0 1vw;
            line-height: 1.1;
        }

        #b_thema {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
            margin: 0 0.5em;
            text-align: center;
        }

        #b_thema-jp {
            letter-spacing: 0.05em;
        }

        #b_thema-ch {
            letter-spacing: 0.05em;
            font-family: "微软雅黑", "宋体", 'Noto Sans SC', sans-serif;
            color: #A5D6A7;
        }

        #b_worship {
            color: #FAD689;
            font-weight: normal;
            flex: 0 0 auto;
        }

        #b_people {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: right;
        }

        #b_speech,
        #b_hymn {
            text-align: left;
        }

        /* 本文エリア */
        #b_out {
            flex: 1;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2vmin;
            color: black;
        }

        /* JSで生成される聖書本文用 */
        #master {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: flex-start;
        }

        #jp,
        #ch {
            width: 48%;
        }

        #jp {
            font-family: 'Noto Serif JP', serif;
        }

        #ch {
            font-family: "微软雅黑", "宋体", "Noto Sans SC", sans-serif;
        }

        u {
            text-decoration: none;
            margin-right: 0.5em;
        }


        /* =========================================
           2. タイトルモード (Title Mode)
           ========================================= */
        #title-view {
            padding: 20px;
        }

        #t_wrap {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 95%;
            text-align: center;
            color: black;
        }

        #t_thema_ja,
        #t_thema_ch,
        #t_worship {
            text-align: center;
            color: rgb(23, 28, 107);
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            line-height: 1.2;
        }

        #t_worship {
            color: #3A8FB7;
            margin-bottom: 20px;
        }

        #t_thema_ch {
            font-family: "微软雅黑", "宋体", "Noto Sans SC", sans-serif;
            margin-top: 10px;
            color: #5C6BC0;
        }

        #t_info {
            display: inline-block;
            margin: 40px auto 0;
            text-align: left;
        }

        #t_speech,
        #t_translator,
        #t_hymn {
            white-space: nowrap;
        }

        #t_hymn {
            color: black;
            margin-top: 20px;
        }

        #b_footer_ticker {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 14vh;
            background: rgba(32, 96, 79, 0.9);
            display: none;
            /* 初期は非表示 */
            color: white;
            z-index: 1000;
            border-top: 3px solid #1a4d3f;
        }

        body.title-mode #b_footer_ticker {
            display: flex;
        }

        .ticker-label {
            background-color: #1a4d3f;
            width: 10vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 3.5vh;
            flex-shrink: 0;
        }

        .ticker-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 3vw;
            font-size: 4.5vh;
            gap: 0.5vh;
        }

        .ticker-ch {
            color: #FFEB3B;
        }

        @media (max-width: 800px) {

            #t_speech,
            #t_translator,
            #t_hymn {
                white-space: normal;
            }
        }


        /* =========================================
           3. 讃美歌モード (Hymn Mode)
           ========================================= */
        #h_output {
            width: 100%;
            height: 100vh;
            position: relative;
            z-index: 10;
        }

        #h_output>div {
            width: 100%;
            height: 100vh;
            display: flex;
            place-items: center;
            align-items: center;
            flex-direction: column;
            justify-content: center;
        }

        #h_title_text {
            font-size: 14rem;
            font-weight: bold;
        }

        #h_ch_text,
        #h_jp_text {
            font-size: 6rem;
            font-weight: 600;
        }

        /* 歌詞番号の背景表示用スタイル  */
        #h_bg_number {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60vh;
            color: rgba(100, 100, 0, 0.3);
            z-index: 0;
            pointer-events: none;
            font-family: sans-serif;
            user-select: none;
            line-height: 1;
            white-space: nowrap;
        }

        /* 聖書表示の箇所の色 */
        .target_ref_jp,
        .target_ref_ch {
            color: #e53935 !important;
        }

        /* 共通ロゴ */
        #common-logo {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 250px;
            height: auto;
            z-index: 2000;
            display: none;
        }

        body.title-mode #common-logo {
            display: block;
        }

        body.bible-mode #common-logo {
            display: block;
            /* 聖書モードの深緑ヘッダーに対してロゴを見やすくするため、白系の背景パネル敷きとドロップシャドウを適用 */
            background-color: rgba(255, 255, 255, 0.85);
            padding: 8px 15px 12px 12px;
            border-bottom-right-radius: 16px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            /* もしロゴ自体を白抜きにしたい場合などは filter: invert(1); も有効ですが、今回は背景パネル方式を採用 */
        }
    </style>
</head>

<body class="title-mode">

    <img id="common-logo" src="../tjc-char.png" alt="Logo"
        onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2NjYyIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjI0IiBmaWxsPSIjMzMzIj5MT0dPPC90ZXh0Pjwvc3ZnPg=='" />

    <div id="bible-view">
        <div id="b_header"></div>
        <div id="b_out"></div>
    </div>

    <div id="title-view">
        <div id="t_wrap">
            <div id="t_worship"></div>
            <div id="t_thema_ja"></div>
            <div id="t_thema_ch"></div>
            <div id="t_info">
                <div id="t_speech"></div>
                <div id="t_translator"></div>
                <div id="t_hymn"></div>
            </div>
        </div>
    </div>
    <div id="b_footer_ticker">
        <div class="ticker-label">
            <div>聖</div>
            <div>書</div>
        </div>
        <div class="ticker-content">
            <div class="ticker-row" id="ticker-jp"></div>
            <div class="ticker-row ticker-ch" id="ticker-ch"></div>
        </div>
    </div>

    <div id="hymn-view">
        <div id="h_bg_number"></div>
        <div id="h_output"></div>
    </div>

    <script>
        // 文字サイズ自動調整
        function fitHeader() {
            const header = document.getElementById('b_header');
            if (!header || !header.offsetParent || !header.innerHTML.trim()) return;
            header.style.fontSize = '10px';
            let min = 10, max = 300, optimal = min;
            while (min <= max) {
                let mid = Math.floor((min + max) / 2);
                header.style.fontSize = mid + 'px';
                if (header.scrollWidth > header.clientWidth || header.scrollHeight > header.clientHeight) {
                    max = mid - 1;
                } else {
                    optimal = mid;
                    min = mid + 1;
                }
            }
            header.style.fontSize = (optimal * 0.95) + 'px';
        }

        function fitTextToContainer() {
            const container = document.getElementById('b_out');
            const content = document.getElementById('master');
            if (!container || !container.offsetParent || !content) return;

            let min = 10, max = 80, optimal = min;
            content.style.fontSize = max + 'px';
            while (min <= max) {
                const mid = Math.floor((min + max) / 2);
                content.style.fontSize = mid + 'px';
                if (container.scrollHeight > container.clientHeight || container.scrollWidth > container.clientWidth) {
                    max = mid - 1;
                } else {
                    optimal = mid;
                    min = mid + 1;
                }
            }
            content.style.fontSize = (optimal * 0.95) + 'px';
        }

        const observer = new MutationObserver(() => {
            requestAnimationFrame(() => {
                if (document.body.classList.contains('bible-mode')) {
                    fitHeader();
                    fitTextToContainer();
                }
            });
        });

        const bHeader = document.getElementById('b_header');
        const bOut = document.getElementById('b_out');
        if (bHeader) observer.observe(bHeader, { childList: true, subtree: true, characterData: true });
        if (bOut) observer.observe(bOut, { childList: true, subtree: true });

        window.addEventListener('resize', () => {
            if (document.body.classList.contains('bible-mode')) {
                fitHeader();
                fitTextToContainer();
            }
        });
    </script>
</body>

</html>
