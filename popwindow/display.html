<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スクリーン表示</title>
    <style>
        /* === 共通設定 === */
        :root {
            --title-logo-width: 250px;
            --bible-logo-height: 18vh;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-weight: bold;
            /* ★元のスタイルの「太字」を再現 */
        }

        html,
        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* === モード別表示制御 === */
        #bible-view,
        #title-view,
        #hymn-view,
        #capture-view {
            display: none;
            width: 100%;
            height: 100%;
        }

        /* bodyクラスで切り替え */
        body.bible-mode {
            background-color: beige;
        }

        body.bible-mode #bible-view {
            display: flex;
            flex-direction: column;
        }

        body.title-mode {
            background-color: beige;
        }

        body.title-mode #title-view {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.hymn-mode {
            background-color: white;
        }

        body.hymn-mode #hymn-view {
            display: block;
        }

        body.capture-mode {
            background-color: black;
        }

        body.capture-mode #capture-view {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #capture-video {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }

        /* =========================================
           1. 聖書モード (Bible Mode)
           ========================================= */
        /* ヘッダー */
        #b_header {
            flex: 0 0 auto;
            width: 100%;
            height: 18vh;
            background-color: #20604F;
            color: white;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            white-space: nowrap;
            overflow: hidden;
            padding: 0 1vw;
            line-height: 1.1;
        }

        #b_thema {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
            margin: 0 0.5em;
            text-align: center;
        }

        #b_thema-jp {
            letter-spacing: 0.05em;
        }

        #b_thema-ch {
            letter-spacing: 0.05em;
            font-family: "微软雅黑", "宋体", 'Noto Sans SC', sans-serif;
            color: #A5D6A7;
        }

        #b_worship {
            color: #FAD689;
            font-weight: normal;
            flex: 0 0 auto;
        }

        #b_people {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: right;
        }

        #b_speech,
        #b_hymn {
            text-align: left;
        }

        /* 本文エリア */
        #b_out {
            flex: 1;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2vmin;
            color: black;
        }

        /* JSで生成される聖書本文用 */
        #master {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: flex-start;
        }

        #jp,
        #ch {
            width: 48%;
        }

        html[data-bible-language="jp"] #jp,
        html[data-bible-language="ch"] #ch { width: 100%; }
        html[data-bible-language="jp"] #b_thema-ch,
        html[data-bible-language="ch"] #b_thema-jp { display: none; }

        .bible_ref_row { white-space: nowrap; overflow-wrap: normal; }
        .bible_body_row { overflow-wrap: anywhere; }
        .bible_page { font-size: 0.5em; white-space: nowrap; }

        #jp {
            font-family: 'Noto Serif JP', serif;
        }

        #ch {
            font-family: "微软雅黑", "宋体", "Noto Sans SC", sans-serif;
        }

        u {
            text-decoration: none;
            margin-right: 0.5em;
        }


        /* =========================================
           2. タイトルモード (Title Mode)
           ========================================= */
        #title-view {
            padding: 20px;
        }

        #t_wrap {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 95%;
            text-align: center;
            color: black;
        }

        #t_thema_ja,
        #t_thema_ch,
        #t_worship {
            text-align: center;
            color: rgb(23, 28, 107);
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            line-height: 1.2;
        }

        #t_worship {
            color: #3A8FB7;
            margin-bottom: 20px;
        }

        #t_thema_ch {
            font-family: "微软雅黑", "宋体", "Noto Sans SC", sans-serif;
            margin-top: 10px;
            color: #5C6BC0;
        }

        #t_info {
            display: inline-block;
            margin: 40px auto 0;
            text-align: left;
        }

        #t_speech,
        #t_translator,
        #t_hymn {
            white-space: nowrap;
        }

        #t_hymn {
            color: black;
            margin-top: 20px;
        }

        #b_footer_ticker {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 14vh;
            background: rgba(32, 96, 79, 0.9);
            display: none;
            /* 初期は非表示 */
            color: white;
            z-index: 1000;
            border-top: 3px solid #1a4d3f;
        }

        body.title-mode:not(.hide-ticker) #b_footer_ticker {
            display: flex;
        }

        .ticker-label {
            background-color: #1a4d3f;
            width: 10vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 3.5vh;
            flex-shrink: 0;
        }

        .ticker-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 3vw;
            font-size: 4.5vh;
            gap: 0.5vh;
        }

        .ticker-ch {
            color: #FFEB3B;
        }

        @media (max-width: 800px) {

            #t_speech,
            #t_translator,
            #t_hymn {
                white-space: normal;
            }
        }


        /* =========================================
           3. 讃美歌モード (Hymn Mode)
           ========================================= */
        #h_output {
            width: 100%;
            height: 100vh;
            position: relative;
            z-index: 10;
        }

        .hymn-title-screen,
        .hymn-verse-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .hymn-title-screen {
            align-items: center;
            justify-content: center;
            padding: 2vw;
            text-align: center;
        }

        #h_title_text {
            font-size: clamp(3rem, 24vmin, 14rem);
        }

        #h_ch_text,
        #h_jp_text {
            overflow-wrap: anywhere;
            font-weight: 600;
            font-size: clamp(1.5rem, 11vmin, 6rem);
        }

        #h_verse_summary {
            margin-top: clamp(0.5rem, 4vmin, 2rem);
            font-size: clamp(1rem, 7vmin, 4rem);
            font-weight: 600;
            color: rgba(0, 0, 0, 0.58);
        }

        .hymn-verse-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6em;
            flex: 0 0 auto;
            padding: 0.28em 2vw;
            background: rgba(255, 255, 255, 0.92);
            border-bottom: 1px solid #ccc;
            font-size: clamp(1rem, 4.5vmin, 4rem);
            text-align: center;
        }

        .hymn-verse-titles {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .hymn-verse-label {
            flex-shrink: 0;
            padding: 0.12em 0.65em;
            border: 2px solid #00838f;
            border-radius: 999px;
            color: #006064;
            font-size: 0.75em;
        }

        .hymn-verse-label span {
            font-size: 0.8em;
        }

        #lyric-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        #lyric-text {
            flex: none;
            width: 100%;
            margin-block: auto;
            padding: 2vh 3vw;
            text-align: center;
            line-height: 1.35;
        }

        .hymn-line {
            width: max-content;
            margin-inline: auto;
            white-space: pre;
        }

        .hymn-lyrics + .hymn-lyrics,
        .hymn-lyrics-missing + .hymn-lyrics,
        .hymn-lyrics + .hymn-lyrics-missing {
            border-top: 1px solid #b9d0d1;
            margin-top: 0.32em;
            padding-top: 0.32em;
        }

        .hymn-lyrics-missing {
            color: #555;
            font-size: 0.55em;
            overflow-wrap: anywhere;
        }

        /* 歌詞番号の背景表示用スタイル  */
        #h_bg_number {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60vh;
            color: rgba(100, 100, 0, 0.3);
            z-index: 0;
            pointer-events: none;
            font-family: sans-serif;
            user-select: none;
            line-height: 1;
            white-space: nowrap;
        }

        /* 聖書表示の箇所の色 */
        .target_ref_jp,
        .target_ref_ch {
            color: var(--bible-reference-color, #e53935);
        }

        /* 共通ロゴ */
        #common-logo {
            position: absolute;
            top: 0px;
            left: 0px;
            width: var(--title-logo-width, 250px);
            max-width: 20vw;
            /* 画面に対して大きくなりすぎないように */
            height: auto;
            z-index: 2000;
            display: none;
        }

        body.title-mode #common-logo {
            display: block;
        }

        body.bible-mode #common-logo {
            display: block;
            width: auto;
            /* 常にヘッダーの高さに収まるように制限し、文字と被らないように調整 */
            max-height: var(--bible-logo-height, 18vh);
            max-width: 20vw;
            /* 聖書モードの深緑ヘッダーに対してロゴを見やすくするため、白系の背景パネル敷きとドロップシャドウを適用 */
            background-color: rgba(255, 255, 255, 0.85);
            padding: 8px 15px 12px 12px;
            border-bottom-right-radius: 16px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* 聖書モードのヘッダーがロゴと被らないように左側に余白を設ける */
        body.bible-mode #b_header {
            padding-left: 24vw;
            /* ロゴの最大幅(20vw) + 余白分を避ける */
            padding-right: 2vw;
            justify-content: flex-start;
        }
        #projection-blackout { display: none; position: fixed; inset: 0; background: #000; z-index: 2147483647; }
        body.is-blacked-out #projection-blackout { display: block; }
    </style>
</head>

<body class="title-mode">
    <div id="projection-blackout" aria-hidden="true"></div>

    <img id="common-logo" src="../tjc-char.png" alt="Logo"
        onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2NjYyIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjI0IiBmaWxsPSIjMzMzIj5MT0dPPC90ZXh0Pjwvc3ZnPg=='" />

    <div id="bible-view">
        <div id="b_header"></div>
        <div id="b_out"></div>
    </div>

    <div id="title-view">
        <div id="t_wrap">
            <div id="t_worship"></div>
            <div id="t_thema_ja"></div>
            <div id="t_thema_ch"></div>
            <div id="t_info">
                <div id="t_speech"></div>
                <div id="t_translator"></div>
                <div id="t_hymn"></div>
            </div>
        </div>
    </div>
    <div id="b_footer_ticker">
        <div class="ticker-label">
            <div>聖</div>
            <div>書</div>
        </div>
        <div class="ticker-content">
            <div class="ticker-row" id="ticker-jp"></div>
            <div class="ticker-row ticker-ch" id="ticker-ch"></div>
        </div>
    </div>

    <div id="hymn-view">
        <div id="h_bg_number"></div>
        <div id="h_output"></div>
    </div>

    <div id="slides-view" style="display:none"><div class="slide-canvas"></div></div>

    <div id="capture-view">
        <video id="capture-video" autoplay playsinline></video>
    </div>

    <link rel="stylesheet" href="../slides/canvas.css?v=4">
    <style>
        #slides-view { position:fixed; inset:0; overflow:hidden; background:#000; font-weight:400; }
        body.slides-mode { background:#000; }
        body.slides-mode #common-logo, body.slides-mode #b_footer_ticker { display:none !important; }
    </style>
    <script>
        document.addEventListener('keydown', event => {
            if (!document.body.classList.contains('slides-mode')) return;
            const direction = ['ArrowRight','ArrowDown','PageDown',' '].includes(event.key) ? 1 : ['ArrowLeft','ArrowUp','PageUp'].includes(event.key) ? -1 : 0;
            if (direction) { event.preventDefault(); window.opener?.SlideProjection?.navigate(direction); }
            if (event.key.toLowerCase() === 'b') window.opener?.SlideProjection?.blackout();
        });
        // 文字サイズ自動調整
        function fitHeader() {
            const header = document.getElementById('b_header');
            if (!header.firstElementChild) return;
            let min = 10, max = 300, optimal = min;
            while (min <= max) {
                let mid = Math.floor((min + max) / 2);
                header.style.fontSize = mid + 'px';
                if (header.scrollWidth > header.clientWidth || header.scrollHeight > header.clientHeight) {
                    max = mid - 1;
                } else {
                    optimal = mid;
                    min = mid + 1;
                }
            }
            header.style.fontSize = (optimal * 0.95) + 'px';
        }

        function fitTextToContainer() {
            const container = document.getElementById('b_out');
            const content = document.getElementById('master');
            if (!content) return;

            const { bibleBodyMax, bibleRefScale, bibleRefMax } = content.dataset;
            const bodyMax = Math.max(1, Math.floor(Number(bibleBodyMax) || 80));
            const refScale = Number(bibleRefScale) || 1;
            const refMax = Math.max(1, Math.floor(Math.min(Number(bibleRefMax) || 80, bodyMax * refScale)));
            const refRows = Array.from(content.querySelectorAll('.bible_ref_row'));
            refRows.forEach(row => { row.style.fontSize = `${refMax}px`; });
            const refLimits = refRows.map(row => {
                const width = row.clientWidth;
                if (row.scrollWidth <= width) return refMax;
                let low = 1, high = refMax - 1;
                while (low < high) {
                    const size = Math.ceil((low + high) / 2);
                    row.style.fontSize = `${size}px`;
                    if (row.scrollWidth <= width) low = size;
                    else high = size - 1;
                }
                return low;
            });
            const padding = getComputedStyle(container);
            const height = container.clientHeight - parseFloat(padding.paddingTop) - parseFloat(padding.paddingBottom);
            function applySize(size) {
                content.style.fontSize = `${size}px`;
                const refSize = Math.max(1, Math.floor(size * refScale));
                refRows.forEach((row, i) => { row.style.fontSize = `${Math.min(refSize, refLimits[i])}px`; });
            }
            function fits(size) {
                applySize(size);
                return content.offsetHeight <= height && content.scrollWidth <= content.clientWidth;
            }
            let low = 1, high = bodyMax;
            if (fits(high)) low = high;
            while (low < high) {
                const size = Math.ceil((low + high) / 2);
                if (fits(size)) low = size;
                else high = size - 1;
            }
            applySize(low * 0.95);
        }

        let headerNeedsFit = true, textNeedsFit = true, fitScheduled = false;
        function scheduleBibleFit() {
            if (fitScheduled || !document.body.classList.contains('bible-mode') || (!headerNeedsFit && !textNeedsFit)) return;
            fitScheduled = true;
            requestAnimationFrame(() => {
                fitScheduled = false;
                if (!document.body.classList.contains('bible-mode')) return;
                if (headerNeedsFit) fitHeader();
                if (textNeedsFit) fitTextToContainer();
                headerNeedsFit = textNeedsFit = false;
            });
        }

        function refitBible() {
            headerNeedsFit = textNeedsFit = true;
            scheduleBibleFit();
        }

        const bHeader = document.getElementById('b_header');
        const bOut = document.getElementById('b_out');
        new MutationObserver(() => {
            headerNeedsFit = true;
            scheduleBibleFit();
        }).observe(bHeader, { childList: true, subtree: true, characterData: true });
        new MutationObserver(() => {
            textNeedsFit = true;
            scheduleBibleFit();
        }).observe(bOut, { childList: true });
        new MutationObserver(scheduleBibleFit).observe(document.body, { attributes: true, attributeFilter: ['class'] });
        new MutationObserver(refitBible).observe(document.documentElement, { attributes: true, attributeFilter: ['data-bible-language'] });
        document.addEventListener('dblclick', async () => {
            try {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    const exit = document.exitFullscreen || document.webkitExitFullscreen;
                    if (exit) await exit.call(document);
                } else {
                    const root = document.documentElement;
                    const enter = root.requestFullscreen || root.webkitRequestFullscreen;
                    if (enter) await enter.call(root);
                }
            } catch (error) { console.warn('全画面表示を切り替えられませんでした', error); }
        });

        window.addEventListener('resize', refitBible);
        document.fonts?.addEventListener('loadingdone', refitBible);
        window.addEventListener('load', () => {
            // Start projecting with system fonts while the web fonts load.
            const fonts = document.createElement('link');
            fonts.rel = 'stylesheet';
            fonts.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700&family=Noto+Serif+JP:wght@700&display=swap';
            document.head.append(fonts);
        });
    </script>
</body>

</html>
