<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テーマ表示</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700&display=swap');
        * {
            box-sizing: border-box;
        }
        *::-webkit-scrollbar {
            display: none;
        }
        body {
            background-color: beige;
            color: black;
            font-weight: bold;
            margin: 0;
            padding: 0;
            overflow: hidden; /* 不要なスクロールバーを消す */
        }
        main {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px; /* 画面端に余裕を持たせる */
        }
        #wrap {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 95%; /* 画面幅いっぱいになりすぎないように */
            text-align: center;
        }
        #thema_ja, #thema_ch, #worship {
            text-align: center;
            color: rgb(23,28,107);
            /* 長文対応: 折り返し設定 */
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            line-height: 1.2;
        }
        #worship {
            color: #3A8FB7;
            margin-bottom: 20px;
        }
        #thema_ch {
            font-family: "微软雅黑","宋体","Noto Sans SC", "sans-serif";
            margin-top: 10px;
        }
        #info {
            display: inline-block;
            margin: 40px auto 0; /* タイトルとの間隔 */
        }
        #speech, #translator, #hymn {
            /* 奉仕者情報のフォントサイズは script.js から制御されますが、ここでも折り返しを考慮 */
            white-space: nowrap; /* 名前などは基本的に折り返さない方が綺麗 */
        }
        /* 画面幅が狭い時は奉仕者情報も折り返し許可 */
        @media (max-width: 800px) {
            #speech, #translator, #hymn {
                white-space: normal;
            }
        }
        #hymn {
            color: black;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <main>
        <div id="wrap">
            <div id="worship"></div>
            <div id="thema_ja"></div>
            <div id="thema_ch"></div>
            <div id="info">
                <div id="speech"></div>
                <div id="translator"></div>
                <div id="hymn"></div>
            </div>
        </div>
    </main>
</body>
</html>
