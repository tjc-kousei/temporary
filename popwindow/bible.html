<!DOCTYPE html>
<html lang="ja">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖書表示</title>
    <meta http-equiv="content-type" charset="utf-8">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&display=swap');

      * {
        box-sizing: border-box;
        font-weight: bold;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background-color: beige;
        display: flex;
        flex-direction: column;
      }

      /* === ヘッダー部分 === */
      #title {
        flex: 0 0 auto;
        width: 100%;
        background-color: #20604F;
        color: white;

        /* 1行に収めるためのFlex設定 */
        display: flex;
        flex-direction: row;
        align-items: center; /* 上下中央揃え */
        justify-content: space-between;
        white-space: nowrap; /* 改行禁止 */
        overflow: hidden; /* はみ出し禁止 */

        padding: 0 1vw; /* 上下のパディングを削除して高さを有効活用 */
        /* 高さを12vhから18vh（1.5倍）に変更 */
        height: 18vh;
        line-height: 1.1; /* 行間を詰める */
      }

      /* 各要素のバランス */
      #thema {
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex: 1; /* 余ったスペースを占有 */
        margin: 0 0.5em; /* マージンを少し詰める */
        text-align: center;
      }

      #thema-jp {
        letter-spacing: 0.05em; /* 字間を少し詰めて大きく表示しやすくする */
      }
      #thema-ch {
        letter-spacing: 0.05em;
        font-family: "微软雅黑","宋体",'Noto Sans SC', sans-serif;
      }

      #worship {
        color: #FAD689;
        font-weight: normal;
        flex: 0 0 auto; /* 縮小しない */
      }

      #people {
        flex: 0 0 auto; /* 縮小しない */
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: right;
      }

      #speech, #hymn {
        text-align: left;
      }

      /* === 本文表示エリア === */
      #out {
        flex: 1; /* 残りの高さを全て使う */
        width: 100%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2vmin;
        color: black;
      }

      #master {
        width: 100%;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
      }

      #jp, #ch {
        width: 48%;
      }

      #jp { font-family: 'Noto Serif JP', serif; }
      #ch { font-family: "微软雅黑","宋体","Noto Sans SC", sans-serif; }

      u { text-decoration: none; margin-right: 0.5em; }
    </style>
</head>
<body>
  <div id="title"></div>
  <div id="out"></div>
  <div id="log" style="display:none;"></div>

  <script>
    // ヘッダー（タイトル部分）の自動サイズ調整
    function fitHeader() {
        const header = document.getElementById('title');
        // 中身（子要素）のいずれかが存在しなければスキップ
        if (!header || !header.innerHTML.trim()) return;

        // フォントサイズのリセット（計算のため）
        header.style.fontSize = '10px';

        let min = 10;
        let max = 300; // 上限を上げておく
        let optimal = min;

        // 二分探索
        while (min <= max) {
            let mid = Math.floor((min + max) / 2);
            header.style.fontSize = mid + 'px';

            // 横にはみ出している OR 縦にはみ出している
            if (header.scrollWidth > header.clientWidth || header.scrollHeight > header.clientHeight) {
                max = mid - 1;
            } else {
                optimal = mid;
                min = mid + 1;
            }
        }

        // 係数を0.95に上げ、よりギリギリまで大きくする
        header.style.fontSize = (optimal * 0.95) + 'px';
    }

    // 本文の自動サイズ調整
    function fitTextToContainer() {
      const container = document.getElementById('out');
      const content = document.getElementById('master');

      if (!container || !content) return;

      let min = 10;
      let max = 100;
      let optimal = min;

      // Reset
      content.style.fontSize = max + 'px';

      while (min <= max) {
        const mid = Math.floor((min + max) / 2);
        content.style.fontSize = mid + 'px';

        if (container.scrollHeight > container.clientHeight || container.scrollWidth > container.clientWidth) {
          max = mid - 1;
        } else {
          optimal = mid;
          min = mid + 1;
        }
      }
      content.style.fontSize = (optimal * 0.95) + 'px';
    }

    // 監視設定
    const observer = new MutationObserver((mutations) => {
      requestAnimationFrame(() => {
        fitHeader();        // ヘッダー調整
        fitTextToContainer(); // 本文調整
      });
    });

    // #title と #out の両方を監視
    const titleNode = document.getElementById('title');
    const outNode = document.getElementById('out');

    if(titleNode) observer.observe(titleNode, { childList: true, subtree: true, characterData: true });
    if(outNode) observer.observe(outNode, { childList: true, subtree: true });

    window.addEventListener('resize', () => {
        fitHeader();
        fitTextToContainer();
    });
  </script>
</body>
</html>
